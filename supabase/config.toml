[db]
port = 5432
shadow_port = 54320
major_version = 17

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
site_url = "easyworkouts://auth/callback"
additional_redirect_urls = [
  "easyworkouts://auth/callback",
  "exp://localhost:8081/--/auth/callback",
  "exp://192.168.*.*:8081/--/auth/callback",
  "http://localhost:8081/auth/callback",
  "http://localhost:19006/auth/callback",
  "com.easyworkouts.app://auth/callback"
]
jwt_expiry = 3600
enable_signup = true

[storage]
file_size_limit = "50MB"

[functions]
  [functions.default]
  # Disabled: Supabase now issues ES256 user tokens, incompatible with legacy HS256 verify_jwt
  # JWT verification is now handled manually in each function using JWKS
  verify_jwt = false
