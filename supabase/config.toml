[db]
port = 5432
shadow_port = 54320
major_version = 17

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
site_url = "coachkettle://auth/callback"
additional_redirect_urls = [
  "coachkettle://auth/callback",
  "exp://localhost:8081/--/auth/callback",
  "exp://192.168.*.*:8081/--/auth/callback",
  "http://localhost:8081/auth/callback",
  "http://localhost:19006/auth/callback",
  "com.coachkettle.app://auth/callback"
]
jwt_expiry = 3600
enable_signup = true

[storage]
file_size_limit = "50MB"

[functions]
  # JWT verification handled manually in each function via supabaseAdmin.auth.getUser()
  [functions.chat]
  verify_jwt = false
  [functions.chat-history]
  verify_jwt = false
  [functions.chats]
  verify_jwt = false
  [functions.coach]
  verify_jwt = false
  [functions.health]
  verify_jwt = false
  [functions.history]
  verify_jwt = false
  [functions.log-set]
  verify_jwt = false
  [functions.observability]
  verify_jwt = false
  [functions.parse]
  verify_jwt = false
  [functions.pr-tracking]
  verify_jwt = false
  [functions.profile]
  verify_jwt = false
  [functions.terms-acceptance]
  verify_jwt = false
  [functions.workout-templates]
  verify_jwt = false
